app:
  namespace: colocation
  name: frontend
  build:
    docker:
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ env.VITE_SUPABASE_ANON_KEY }}
  resources:
    cpu: 1
    memory: 256
  expose:
    http:
      port: 80
      external:
        protocol: https
